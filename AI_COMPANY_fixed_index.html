const names=['ホーム','部署オフィス','拡大・操作','AI社員詳細','仕事の指示','結果レポート'];
let page='home',dept='SNS運用事業部',person='リサーチ担当',task='InstagramとTikTokで直近7日間に話題のAI関連投稿を調査し、人気テーマを5つまとめて。',sources=['Instagram','TikTok'],level='標準調査',approval=true,submitted=false,zoom=1;
const frame=document.getElementById('frame'),nav=document.getElementById('nav');
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>e.hidden=true,2700)}
function hot(x,y,w,h,fn,label){return `<button class="hot" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" aria-label="${label}" onclick="${fn}"></button>`}
function screen(i,extra=''){return `<img class="mock" alt="${names[i]}の正式採用デザイン" src="${imgs[i]}">${extra}`}
function show(p){page=p;render()}
function setPerson(s){person=s;show('employee')}
function setDept(s){dept=s;show('office')}
function render(){let h='';if(page==='home'){h=screen(0,hot(2,38,48,23,"setDept('SNS運用事業部')",'SNS運用事業部')+hot(51,38,47,23,"setDept('コンテンツ販売事業部')",'コンテンツ販売事業部')+hot(2,61,49,22,"setDept('業務効率化サポート事業部')",'業務効率化サポート事業部')+hot(50,61,48,22,"toast('新規事業部は今後実装します')",'新規事業部')+hot(4,20,92,18,"show('reports')",'成果を見る'))}
else if(page==='office'){h=screen(1,hot(8,26,84,52,"show('zoom')",'オフィスを拡大')+hot(2,83,26,17,"setPerson('リサーチ担当')",'リサーチ担当')+hot(29,83,25,17,"setPerson('企画担当')",'企画担当')+hot(54,83,24,17,"setPerson('制作担当')",'制作担当')+hot(80,83,20,17,"setPerson('投稿担当')",'投稿担当')+hot(0,0,25,8,"show('home')",'ホームに戻る'))}
else if(page==='zoom'){h=screen(2,hot(0,0,26,9,"show('office')",'戻る')+hot(20,20,62,57,"setPerson('リサーチ担当')",'リサーチ担当を開く')+hot(0,81,51,19,"show('employee')",'詳細を見る')+hot(51,81,49,19,"show('assign')",'仕事を指示'))+`<div class="zoomctl"><button onclick="zoom=Math.min(1.8,zoom+.15);document.querySelector('.mock').style.transform='scale('+zoom+')'">＋</button><button onclick="zoom=Math.max(1,zoom-.15);document.querySelector('.mock').style.transform='scale('+zoom+')'">−</button></div>`}
else if(page==='employee'){h=screen(3,hot(0,0,30,8,"show('office')",'部署に戻る')+hot(2,85,53,15,"show('assign')",'仕事を指示')+hot(55,85,45,15,"toast('デモでは実行中タスクがありません')",'一時停止')+hot(0,54,100,18,"show('reports')",'履歴を見る'))}
else if(page==='assign'){h=`<div class="sheet"><button class="secondary" onclick="show('employee')">← AI社員詳細へ戻る</button><h2>📝 新しい仕事を指示</h2><div class="notice">担当：${person}　／　画面操作のデモです。AIはまだ実行しません。</div><label for="task">調査内容</label><textarea id="task" maxlength="1000" oninput="task=this.value">${escapeHtml(task)}</textarea><label>調査対象</label><div class="pills">${['Instagram','TikTok','X','YouTube'].map(s=>`<button class="pill ${sources.includes(s)?'on':''}" onclick="toggleSource('${s}')">${s} ${sources.includes(s)?'✓':''}</button>`).join('')}</div><label for="level">調査の詳しさ</label><select id="level" onchange="level=this.value">${['簡易調査','標準調査','詳細調査'].map(s=>`<option ${level===s?'selected':''}>${s}</option>`).join('')}</select><label><input style="width:auto" type="checkbox" ${approval?'checked':''} onchange="approval=this.checked"> 次の社員への引き継ぎ前に承認する</label><button class="primary" onclick="submitTask()">指示を保存してプレビュー →</button><div class="muted">※ 入力内容はこのページを開いている間だけ保持されます。サーバーには送信しません。</div></div>`}
else if(page==='result'){h=screen(5,hot(0,0,28,10,"show('employee')",'戻る')+hot(0,84,50,16,"approve()",'承認して次へ')+hot(50,84,50,16,"show('assign')",'修正依頼'))+`<div class="shade">${submitted?'指示プレビュー（未実行）':'サンプル結果（未実行）'}</div>`}
else if(page==='approvals'){h=`<div class="sheet"><h2>🔔 承認待ち</h2><div class="card"><b>${submitted?'1件のデモ指示':'承認待ちはありません'}</b><p class="muted">${submitted?escapeHtml(task):'実際のAI実行はまだ接続されていません。'}</p>${submitted?'<button class="primary" onclick="show(\'result\')">内容を確認する</button>':''}</div></div>`}
else if(page==='departments'){h=`<div class="sheet"><h2>🏢 部署一覧</h2>${['SNS運用事業部','コンテンツ販売事業部','業務効率化サポート事業部'].map((d,i)=>`<button class="listitem" onclick="setDept('${d}')"><span>${['🔵','🌸','🌿'][i]} ${d}</span><span>›</span></button>`).join('')}<button class="listitem" onclick="toast('新規事業部は今後実装します')">＋ 新規事業部を追加</button></div>`}
else if(page==='reports'){h=`<div class="sheet"><h2>📊 成果・レポート</h2><div class="card"><div class="smallhead">売上（サンプル）</div><h2>¥412,800</h2><p class="muted">元画像のダミー数値です。実際の売上ではありません。</p></div><button class="primary" onclick="show('result')">調査結果のデザインを見る</button></div>`}
else if(page==='workers'){h=`<div class="sheet"><h2>🤖 AI社員</h2>${['リサーチ担当','企画担当','制作担当','投稿担当','情報収集担当'].map((w,i)=>`<button class="listitem" onclick="setPerson('${w}')"><span>${['🔵','🟡','🟢','🟣','🩵'][i]} ${w}</span><span>›</span></button>`).join('')}</div>`}
frame.innerHTML=h;nav.innerHTML=[['home','⌂','ホーム'],['departments','▦','部署'],['workers','♟','AI社員'],['approvals','☑','承認']].map(a=>`<button class="${page===a[0]?'active':''}" onclick="show('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleSource(s){sources=sources.includes(s)?sources.filter(x=>x!==s):[...sources,s];const v=document.getElementById('task').value;task=v;render()}
function submitTask(){task=document.getElementById('task').value.trim();if(!task){toast('調査内容を入力してください');return}if(!sources.length){toast('調査対象を選択してください');return}submitted=true;show('result');toast('指示をデモ保存しました（AI未実行）')}
function approve(){if(!submitted){toast('これはサンプルです。実際の引き継ぎはありません');return}toast('デモ承認しました。実際の引き継ぎは未実装です');submitted=false;show('office')}
render();
</script></body></html>
